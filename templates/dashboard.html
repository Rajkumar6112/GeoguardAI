<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landslide Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { width: 80%; margin: auto; }
        h2 { color: #2c3e50; }
        .status { font-size: 20px; font-weight: bold; margin-top: 10px; }
        .safe { color: green; }
        .warning { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌍 Landslide Monitoring Dashboard</h2>

        <p><b>Soil Moisture:</b> <span id="soil_moisture">0</span></p>
        <p><b>Rain Sensor:</b> <span id="rain_sensor">0</span></p>
        <p class="status" id="landslide_status">Checking...</p>

        <canvas id="sensorChart" width="400" height="200"></canvas>
    </div>

    <script>
        const ctx = document.getElementById("sensorChart").getContext("2d");
        let sensorChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: [],
                datasets: [
                    { label: "Soil Moisture", data: [], borderColor: "blue", fill: false },
                    { label: "Rain Sensor", data: [], borderColor: "orange", fill: false }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        function fetchData() {
            console.log(data);
            fetch("/get_data")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("soil_moisture").innerText = data.soil_moisture;
                    document.getElementById("rain_sensor").innerText = data.rain_sensor;
                    document.getElementById("rf_confidence").innerText = data.rf_confidence ? data.rf_confidence + "%" : "--";
                    document.getElementById("dt_confidence").innerText = data.dt_confidence ? data.dt_confidence + "%" : "--";
                    document.getElementById("riskScore").innerText = data.risk_score ? data.risk_score + " %" : "--";
                    document.getElementById("rf").innerText = data.rf_prediction ?? "--";
                    document.getElementById("dt").innerText = data.dt_prediction ?? "--";
                    
                    let scoreElement = document.getElementById("riskScore");

                    if (data.risk_score >= 70) {
                        scoreElement.style.color = "#ef4444";
                    } else if (data.risk_score >= 40) {
                        scoreElement.style.color = "#facc15";
                    } else {
                        scoreElement.style.color = "#22c55e";
                    }

                    let statusEl = document.getElementById("landslide_status");
                    if (data.landslide_occurrence === 1) {
                        statusEl.innerText = "⚠️ Landslide Detected!";
                        statusEl.className = "status warning";
                    } else {
                        statusEl.innerText = "✅ No Landslide";
                        statusEl.className = "status safe";
                    }

                    // Update chart
                    if (sensorChart.data.labels.length > 10) {
                        sensorChart.data.labels.shift();
                        sensorChart.data.datasets[0].data.shift();
                        sensorChart.data.datasets[1].data.shift();
                    }

                    sensorChart.data.labels.push(new Date().toLocaleTimeString());
                    sensorChart.data.datasets[0].data.push(data.soil_moisture);
                    sensorChart.data.datasets[1].data.push(data.rain_sensor);
                    sensorChart.update();
                });
        }

        setInterval(fetchData, 2000);
    </script>
</body>
</html>
